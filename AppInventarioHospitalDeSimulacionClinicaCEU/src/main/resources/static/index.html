<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Almacenes · Hospital de simulación</title>
    <link rel="stylesheet" href="css/bootstrap.min.css?v=2">
    <link rel="stylesheet" href="css/estilos.css?v=2">
</head>
<body>
<main class="container py-4" style="max-width: 42rem;">
    <!-- Volver atrás (solo aparece si hay a dónde volver) -->
    <button id="volver" type="button" class="btn btn-link text-white p-0 mb-2" hidden>← Volver</button>

    <header class="text-center mb-4">
        <h1 class="display-5 fw-bold">Almacenes</h1>
        <p class="lead mb-0">Hospital de simulación clínica</p>
    </header>

    <div id="mensaje" class="mensaje mensaje-morado" hidden></div>
    <div id="lista" class="list-group mb-4"></div>
    <button id="btn-imprimir" class="btn btn-primary btn-lg w-100" type="button">Imprimir inventario</button>
</main>

<script src="js/api.js"></script>
<script>
    const lista = document.getElementById('lista');
    const mensaje = document.getElementById('mensaje');

    document.getElementById('btn-imprimir').addEventListener('click', descargarInforme);

    // "Volver": retrocede en el historial, como el botón atrás del navegador.
    // Si no hay historial (por ejemplo, se abrió esta página directamente), usa el
    // último almacén abierto; y si tampoco hay, el botón no se muestra.
    const volver = document.getElementById('volver');
    let ultimoId = null;
    try {
        const ultimo = JSON.parse(localStorage.getItem('ultimoAlmacen'));
        if (ultimo && Number.isFinite(Number(ultimo.id))) ultimoId = Number(ultimo.id);
    } catch (e) { /* sin datos guardados */ }

    if (history.length > 1 || ultimoId !== null) volver.hidden = false;
    volver.addEventListener('click', () => {
        if (history.length > 1) history.back();
        else location.href = 'almacen.html?id=' + encodeURIComponent(ultimoId);
    });

    async function cargar() {
        try {
            const almacenes = await getAlmacenes();
            if (almacenes.length === 0) {
                lista.innerHTML = '<div class="list-group-item text-center py-4">Aún no hay almacenes registrados.</div>';
                return;
            }
            for (const a of almacenes) {
                const enlace = document.createElement('a');
                enlace.className = 'list-group-item list-group-item-action py-3';
                enlace.href = 'almacen.html?id=' + encodeURIComponent(a.id);
                const nombre = document.createElement('div');
                nombre.className = 'fw-bold fs-5';
                nombre.textContent = a.nombre;
                const desc = document.createElement('small');
                desc.className = 'text-body-secondary';
                desc.textContent = a.descripcion || '';
                enlace.append(nombre, desc);
                lista.append(enlace);
            }
        } catch (e) {
            mensaje.textContent = 'No se pudo cargar la lista de almacenes. ' + e.message;
            mensaje.hidden = false;
        }
    }
    cargar();
</script>
</body>
</html>
