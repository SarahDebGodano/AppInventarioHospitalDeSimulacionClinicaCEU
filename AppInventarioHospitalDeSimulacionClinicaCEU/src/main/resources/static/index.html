<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Almacenes · Hospital de simulación</title>
    <link rel="stylesheet" href="css/bootstrap.min.css?v=2">
    <link rel="stylesheet" href="css/estilos.css?v=5">
</head>
<body>
<main class="container py-4" style="max-width: 42rem;">
    <header class="text-center mb-4">
        <!-- Usuario actual: pulsarlo lleva a cambiar de usuario (el enlace y el nombre los pone el script) -->
        <div class="d-flex justify-content-end mb-2">
            <a id="cambiar-usuario" href="usuarios.html" class="burbuja chip-usuario" title="Cambiar de usuario">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <span class="visually-hidden">Usuario:</span>
                <strong id="usuario-nombre" class="chip-usuario-nombre"></strong>
                <svg class="chip-usuario-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                <span class="visually-hidden">(pulsa para cambiar de usuario)</span>
            </a>
        </div>
        <!-- Si falta el fichero img/logo-ceu.png, la pastilla se oculta sola -->
        <div class="logo-ceu mb-3"><img src="img/logo-ceu.png" alt="CEU" onerror="this.parentElement.hidden = true"></div>
        <h1 class="display-5 fw-bold">Almacenes</h1>
        <p class="lead mb-0">Hospital de simulación clínica</p>
    </header>

    <div id="mensaje" class="mensaje mensaje-morado" hidden></div>
    <div id="lista" class="list-group mb-4"></div>
    <button id="btn-imprimir" class="btn btn-primary btn-lg w-100" type="button">Imprimir inventario</button>
</main>

<script src="js/api.js"></script>
<script>
    const lista = document.getElementById('lista');
    const mensaje = document.getElementById('mensaje');

    document.getElementById('btn-imprimir').addEventListener('click', descargarInforme);

    async function cargar() {
        try {
            const almacenes = await getAlmacenes();
            if (almacenes.length === 0) {
                lista.innerHTML = '<div class="list-group-item text-center py-4">Aún no hay almacenes registrados.</div>';
                return;
            }
            for (const a of almacenes) {
                const enlace = document.createElement('a');
                enlace.className = 'list-group-item list-group-item-action py-3';
                enlace.href = 'almacen.html?id=' + encodeURIComponent(a.id);
                const nombre = document.createElement('div');
                nombre.className = 'fw-bold fs-5';
                nombre.textContent = a.nombre;
                const desc = document.createElement('small');
                desc.className = 'text-body-secondary';
                desc.textContent = a.descripcion || '';
                enlace.append(nombre, desc);
                lista.append(enlace);
            }
        } catch (e) {
            mensaje.textContent = 'No se pudo cargar la lista de almacenes. ' + e.message;
            mensaje.hidden = false;
        }
    }

    // Antes de nada hay que saber quién usa la app (los movimientos se apuntan a su nombre)
    async function iniciar() {
        const usuario = await exigirUsuario();
        if (!usuario) return;
        document.getElementById('usuario-nombre').textContent = usuario.nombre;
        document.getElementById('cambiar-usuario').href = urlElegirUsuario();
        cargar();
    }
    iniciar();
</script>
</body>
</html>
