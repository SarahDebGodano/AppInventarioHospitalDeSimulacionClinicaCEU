<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Almacén · Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="cabecera">
    <h1 id="titulo">Almacén</h1>
    <p><a href="index.html">Todos los almacenes</a></p>
</header>

<main>
    <p id="mensaje" class="mensaje" hidden></p>

    <div class="controles">
        <div>
            <label for="usuario">¿Quién eres?</label>
            <select id="usuario"></select>
        </div>
        <div>
            <label for="buscador">Buscar producto</label>
            <input id="buscador" type="search" placeholder="Nombre, categoría o ubicación" autocomplete="off">
        </div>
    </div>

    <ul id="productos" class="productos"></ul>
</main>

<p id="aviso" class="aviso-flotante" role="status" hidden></p>

<script src="js/api.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const almacenId = Number(params.get('id'));

    const elTitulo = document.getElementById('titulo');
    const elMensaje = document.getElementById('mensaje');
    const elUsuario = document.getElementById('usuario');
    const elBuscador = document.getElementById('buscador');
    const elLista = document.getElementById('productos');
    const elAviso = document.getElementById('aviso');

    let existencias = [];
    let temporizadorAviso;

    function mostrarMensaje(texto, esError) {
        elMensaje.textContent = texto;
        elMensaje.className = 'mensaje' + (esError ? ' error' : '');
        elMensaje.hidden = !texto;
    }

    function avisar(texto) {
        elAviso.textContent = texto;
        elAviso.hidden = false;
        clearTimeout(temporizadorAviso);
        temporizadorAviso = setTimeout(() => { elAviso.hidden = true; }, 2000);
    }

    // localStorage puede fallar (modo privado), por eso va protegido.
    function leerUsuarioGuardado() {
        try { return localStorage.getItem('usuarioId'); } catch (e) { return null; }
    }
    function guardarUsuario(id) {
        try { localStorage.setItem('usuarioId', id); } catch (e) { /* sin persistencia */ }
    }

    async function cargarUsuarios() {
        const usuarios = await getUsuarios();
        const opcion0 = new Option('Elige tu nombre', '');
        elUsuario.append(opcion0);
        for (const u of usuarios) elUsuario.append(new Option(u.nombre, u.id));
        const guardado = leerUsuarioGuardado();
        if (guardado && usuarios.some(u => String(u.id) === guardado)) elUsuario.value = guardado;
        elUsuario.addEventListener('change', () => {
            guardarUsuario(elUsuario.value);
            pintar();
        });
    }

    async function cargarTitulo() {
        const almacenes = await getAlmacenes();
        const a = almacenes.find(x => x.id === almacenId);
        if (a) { elTitulo.textContent = a.nombre; document.title = a.nombre + ' · Inventario'; }
    }

    function pintar() {
        const texto = elBuscador.value.trim().toLowerCase();
        const visibles = existencias.filter(e =>
            [e.producto, e.categoria, e.ubicacion].some(c => (c || '').toLowerCase().includes(texto)));

        elLista.replaceChildren();
        if (visibles.length === 0) {
            const li = document.createElement('li');
            li.className = 'vacio';
            li.textContent = texto ? 'Ningún producto coincide con la búsqueda.' : 'Este almacén aún no tiene productos.';
            elLista.append(li);
            return;
        }

        for (const e of visibles) {
            const bajo = e.cantidad < e.minimo;
            const li = document.createElement('li');
            li.className = 'producto' + (bajo ? ' bajo' : '');

            const titulo = document.createElement('h2');
            titulo.textContent = e.producto;
            if (bajo) {
                const tag = document.createElement('span');
                tag.className = 'etiqueta-bajo';
                tag.textContent = 'Bajo mínimo';
                titulo.append(tag);
            }

            const detalle = document.createElement('p');
            detalle.className = 'detalle';
            detalle.textContent = [e.categoria, e.ubicacion, 'Mínimo ' + e.minimo].filter(Boolean).join(', ');

            // Barra de nivel: la marca central equivale al mínimo; llena al doble del mínimo.
            const nivel = document.createElement('div');
            nivel.className = 'nivel';
            nivel.setAttribute('aria-hidden', 'true');
            const relleno = document.createElement('div');
            relleno.className = 'relleno';
            const tope = Math.max(e.minimo * 2, 1);
            relleno.style.width = Math.min(100, (e.cantidad / tope) * 100) + '%';
            nivel.append(relleno);

            const fila = document.createElement('div');
            fila.className = 'cantidad';

            const menos = document.createElement('button');
            menos.type = 'button';
            menos.textContent = '−';
            menos.setAttribute('aria-label', 'Restar una unidad de ' + e.producto);
            menos.disabled = e.cantidad <= 0;
            menos.addEventListener('click', () => mover(e, 'SALIDA'));

            const numero = document.createElement('output');
            numero.textContent = e.cantidad;

            const mas = document.createElement('button');
            mas.type = 'button';
            mas.className = 'mas';
            mas.textContent = '+';
            mas.setAttribute('aria-label', 'Sumar una unidad de ' + e.producto);
            mas.addEventListener('click', () => mover(e, 'ENTRADA'));

            fila.append(menos, numero, mas);
            li.append(titulo, detalle, nivel, fila);
            elLista.append(li);
        }
    }

    async function recargarExistencias() {
        existencias = await getExistencias(almacenId);
        pintar();
    }

    async function mover(existencia, tipo) {
        if (!elUsuario.value) {
            mostrarMensaje('Elige tu nombre arriba antes de mover material.', true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            elUsuario.focus();
            return;
        }
        mostrarMensaje('', false);
        try {
            await postMovimiento({
                almacenId: almacenId,
                productoId: existencia.productoId,
                cantidad: 1,
                tipo: tipo,
                usuarioId: Number(elUsuario.value),
            });
            await recargarExistencias();
            avisar(tipo === 'SALIDA' ? 'Salida registrada' : 'Entrada registrada');
        } catch (err) {
            mostrarMensaje('No se pudo registrar el movimiento. ' + err.message, true);
        }
    }

    async function iniciar() {
        if (!almacenId) {
            mostrarMensaje('Falta el almacén en la dirección. Entra desde la lista de almacenes o escanea el QR.', true);
            return;
        }
        try {
            await Promise.all([cargarTitulo(), cargarUsuarios(), recargarExistencias()]);
            pintar();
        } catch (err) {
            mostrarMensaje('No se pudo cargar el almacén. ' + err.message, true);
        }
    }

    elBuscador.addEventListener('input', pintar);
    iniciar();
</script>
</body>
</html>
