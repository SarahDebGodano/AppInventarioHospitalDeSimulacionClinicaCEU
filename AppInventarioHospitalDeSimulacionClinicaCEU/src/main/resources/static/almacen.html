<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Almacén · Inventario</title>
    <link rel="stylesheet" href="css/bootstrap.min.css?v=2">
    <link rel="stylesheet" href="css/estilos.css?v=2">
</head>
<body>
<main class="container py-3" style="max-width: 42rem;">
    <header class="mb-3">
        <a href="index.html" class="small">← Todos los almacenes</a>
        <h1 id="titulo" class="h2 fw-bold mt-1">Almacén</h1>
    </header>

    <div id="mensaje" class="mensaje mensaje-rosa" hidden></div>

    <div class="card controles-fijos mb-3">
        <div class="card-body">
            <label for="buscador" class="form-label">Buscar producto</label>
            <input id="buscador" type="search" class="form-control form-control-lg" placeholder="Nombre, categoría o ubicación" autocomplete="off">
        </div>
    </div>

    <div id="productos"></div>
</main>

<div id="aviso" class="aviso-flotante alert alert-dark position-fixed bottom-0 start-50 translate-middle-x mb-3 py-2 px-4" role="status" hidden></div>

<script src="js/api.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const almacenId = Number(params.get('id'));

    const elTitulo = document.getElementById('titulo');
    const elMensaje = document.getElementById('mensaje');
    const elBuscador = document.getElementById('buscador');
    const elLista = document.getElementById('productos');
    const elAviso = document.getElementById('aviso');

    let existencias = [];
    let temporizadorAviso;

    function mostrarMensaje(texto, esError) {
        elMensaje.textContent = texto;
        elMensaje.className = 'mensaje ' + (esError ? 'mensaje-morado' : 'mensaje-rosa');
        elMensaje.hidden = !texto;
    }

    function avisar(texto) {
        elAviso.textContent = texto;
        elAviso.hidden = false;
        clearTimeout(temporizadorAviso);
        temporizadorAviso = setTimeout(() => { elAviso.hidden = true; }, 2000);
    }

    async function cargarTitulo() {
        const almacenes = await getAlmacenes();
        const a = almacenes.find(x => x.id === almacenId);
        if (a) { elTitulo.textContent = a.nombre; document.title = a.nombre + ' · Inventario'; }
    }

    function crear(etiqueta, clases, texto) {
        const el = document.createElement(etiqueta);
        if (clases) el.className = clases;
        if (texto !== undefined) el.textContent = texto;
        return el;
    }

    function pintar() {
        const texto = elBuscador.value.trim().toLowerCase();
        const visibles = existencias.filter(e =>
            [e.producto, e.categoria, e.ubicacion].some(c => (c || '').toLowerCase().includes(texto)));

        elLista.replaceChildren();
        if (visibles.length === 0) {
            elLista.append(crear('p', 'text-center py-4',
                texto ? 'Ningún producto coincide con la búsqueda.' : 'Este almacén aún no tiene productos.'));
            return;
        }

        for (const e of visibles) {
            const bajo = e.cantidad < e.minimo;
            const tarjeta = crear('div', 'card mb-3');
            const cuerpo = crear('div', 'card-body');

            const titulo = crear('h2', 'h5 mb-1', e.producto);
            if (bajo) titulo.append(crear('span', 'badge text-bg-danger ms-2', 'Bajo mínimo'));

            const detalle = crear('p', 'small text-body-secondary mb-3',
                [e.categoria, e.ubicacion, 'Mínimo ' + e.minimo].filter(Boolean).join(', '));

            // Barra de nivel: la marca central equivale al mínimo; llena al doble del mínimo.
            const nivel = crear('div', 'nivel mb-3');
            nivel.setAttribute('aria-hidden', 'true');
            const progreso = crear('div', 'progress');
            progreso.style.height = '8px';
            const barra = crear('div', 'progress-bar ' + (bajo ? 'bg-danger' : 'bg-success'));
            barra.style.width = Math.min(100, (e.cantidad / Math.max(e.minimo * 2, 1)) * 100) + '%';
            progreso.append(barra);
            nivel.append(progreso);

            const fila = crear('div', 'd-flex align-items-center justify-content-between gap-3');

            const menos = crear('button', 'btn btn-outline-primary rounded-circle btn-cantidad', '−');
            menos.type = 'button';
            menos.setAttribute('aria-label', 'Restar una unidad de ' + e.producto);
            menos.disabled = e.cantidad <= 0;
            menos.addEventListener('click', () => mover(e, 'SALIDA'));

            const numero = crear('output', 'fs-1 fw-bold flex-fill text-center' + (bajo ? ' text-danger' : ''), e.cantidad);

            const mas = crear('button', 'btn btn-primary rounded-circle btn-cantidad', '+');
            mas.type = 'button';
            mas.setAttribute('aria-label', 'Sumar una unidad de ' + e.producto);
            mas.addEventListener('click', () => mover(e, 'ENTRADA'));

            fila.append(menos, numero, mas);
            cuerpo.append(titulo, detalle, nivel, fila);
            tarjeta.append(cuerpo);
            elLista.append(tarjeta);
        }
    }

    async function recargarExistencias() {
        existencias = await getExistencias(almacenId);
        pintar();
    }

    async function mover(existencia, tipo) {
        mostrarMensaje('', false);
        try {
            await postMovimiento({
                almacenId: almacenId,
                productoId: existencia.productoId,
                cantidad: 1,
                tipo: tipo,
                usuarioId: null, // TODO: acordar con Sarah si el movimiento puede guardarse sin usuario
            });
            await recargarExistencias();
            avisar(tipo === 'SALIDA' ? 'Salida registrada' : 'Entrada registrada');
        } catch (err) {
            mostrarMensaje('No se pudo registrar el movimiento. ' + err.message, true);
        }
    }

    async function iniciar() {
        if (!almacenId) {
            mostrarMensaje('Falta el almacén en la dirección. Entra desde la lista de almacenes o escanea el QR.', false);
            return;
        }
        try {
            await Promise.all([cargarTitulo(), recargarExistencias()]);
        } catch (err) {
            mostrarMensaje('No se pudo cargar el almacén. ' + err.message, true);
        }
    }

    elBuscador.addEventListener('input', pintar);
    iniciar();
</script>
</body>
</html>
