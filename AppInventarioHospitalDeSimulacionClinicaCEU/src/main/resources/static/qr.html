<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Códigos QR · Almacenes</title>
    <link rel="stylesheet" href="css/bootstrap.min.css?v=2">
    <link rel="stylesheet" href="css/estilos.css?v=2">
    <style>
        .etiquetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
        .etiqueta { background: #fff; color: #212529; border-radius: 0.5rem; padding: 0.75rem; text-align: center; break-inside: avoid; }
        .etiqueta svg { width: 100%; height: auto; max-width: 200px; }
        .etiqueta .nombre { font-weight: 700; font-size: 1.05rem; }
        .etiqueta .descripcion { font-size: 0.85rem; color: #555; }
        .etiqueta .url { font-size: 0.65rem; color: #666; word-break: break-all; margin-top: 0.25rem; }

        @media print {
            body { background: #fff !important; background-image: none !important; }
            .no-imprimir { display: none !important; }
            .etiquetas { grid-template-columns: repeat(3, 1fr); gap: 0.5cm; }
            .etiqueta { border: 1px solid #000; }
        }
    </style>
</head>
<body>
<main class="container py-4">
    <div class="no-imprimir">
        <a href="index.html" class="burbuja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg> Todos los almacenes</a>
        <h1 class="h2 fw-bold mt-1">Códigos QR</h1>
        <p class="mb-1">Cada código abre directamente la pantalla de su almacén. Imprímelos y pégalos en cada almacén.</p>
        <p id="resumen" class="small"></p>

        <div id="mensaje" class="mensaje mensaje-rosa" hidden></div>

        <div class="card mb-4">
            <div class="card-body">
                <label for="base" class="form-label">Dirección de la aplicación</label>
                <input id="base" type="url" inputmode="url" class="form-control form-control-lg" autocomplete="off" spellcheck="false">
                <div id="ayuda-base" class="form-text">
                    La que escribiría alguien en el navegador del móvil, sin barra al final.
                    Ejemplo: <code>http://inventario.ceu.es</code>
                </div>
                <button id="btn-imprimir" type="button" class="btn btn-primary btn-lg w-100 mt-3">Imprimir códigos</button>
            </div>
        </div>
    </div>

    <div id="etiquetas" class="etiquetas"></div>
</main>

<script src="js/api.js"></script>
<script src="js/qr.js"></script>
<script>
    // Dirección oficial de la aplicación. Rellénala UNA sola vez, cuando Informática os dé la
    // dirección fija (por ejemplo 'http://inventario.ceu.es'). Con ella puesta, los QR salen
    // idénticos desde cualquier ordenador y el campo queda bloqueado.
    const DIRECCION_OFICIAL = '';

    const elBase = document.getElementById('base');
    const elMensaje = document.getElementById('mensaje');
    const elResumen = document.getElementById('resumen');
    const elEtiquetas = document.getElementById('etiquetas');
    let almacenes = [];

    function mostrarMensaje(texto, esError) {
        elMensaje.textContent = texto;
        elMensaje.className = 'mensaje ' + (esError ? 'mensaje-morado' : 'mensaje-rosa');
        elMensaje.hidden = !texto;
    }

    // Deja la dirección siempre escrita igual: añade http:// si falta, pone el servidor en
    // minúsculas y quita barras finales y puertos por defecto. Así el QR no cambia por detalles.
    function normalizar(texto) {
        let b = texto.trim();
        if (!b) return '';
        if (!/^https?:\/\//i.test(b)) b = 'http://' + b;
        try {
            const u = new URL(b);
            return u.origin + u.pathname.replace(/\/+$/, '');
        } catch (e) {
            return b.replace(/\/+$/, '');
        }
    }

    function pintar() {
        const base = normalizar(elBase.value);
        elEtiquetas.replaceChildren();

        // Un único QR por almacén, aunque la lista viniera con repetidos
        const unicos = [...new Map(almacenes.map(a => [a.id, a])).values()];
        elResumen.textContent = unicos.length + ' almacenes → ' + unicos.length + ' códigos (uno por almacén)';

        const avisos = [];
        let host = '';
        try { host = new URL(base).hostname; } catch (e) { /* dirección aún incompleta */ }
        if (!DIRECCION_OFICIAL) {
            avisos.push('Aún no hay dirección oficial fijada en qr.html (DIRECCION_OFICIAL): estos QR son provisionales.');
        }
        if (host === 'localhost' || host === '127.0.0.1') {
            avisos.push('Con "localhost" los QR solo funcionan en este ordenador.');
        } else if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) {
            avisos.push('La dirección es una IP, que puede cambiar. Para QR definitivos pide un nombre fijo a Informática.');
        }
        if (unicos.some(a => !a.codigoQr)) {
            avisos.push('Algunos almacenes no tienen código fijo (codigo_qr): su QR usa el número de almacén y no es definitivo.');
        }
        mostrarMensaje(avisos.join(' '), false);
        if (!base) return;

        for (const a of unicos) {
            // Con código fijo, el QR no depende del número interno del almacén
            const clave = a.codigoQr ? 'c=' + encodeURIComponent(a.codigoQr) : 'id=' + encodeURIComponent(a.id);
            const url = base + '/almacen.html?' + clave;

            const etiqueta = document.createElement('div');
            etiqueta.className = 'etiqueta';

            const qr = document.createElement('div');
            try {
                qr.innerHTML = QR.svg(url, 'Código QR de ' + a.nombre);   // SVG generado por qr.js
            } catch (e) {
                qr.textContent = 'La dirección es demasiado larga para un QR.';
            }

            const nombre = document.createElement('div');
            nombre.className = 'nombre';
            nombre.textContent = a.nombre;

            const desc = document.createElement('div');
            desc.className = 'descripcion';
            desc.textContent = a.descripcion || '';

            const dir = document.createElement('div');
            dir.className = 'url';
            dir.textContent = url;

            etiqueta.append(qr, nombre, desc, dir);
            elEtiquetas.append(etiqueta);
        }
    }

    async function iniciar() {
        if (DIRECCION_OFICIAL) {
            elBase.value = DIRECCION_OFICIAL;
            elBase.readOnly = true;
            document.getElementById('ayuda-base').textContent =
                'Dirección oficial, fijada en qr.html (DIRECCION_OFICIAL). Para cambiarla, edita ese fichero.';
        } else {
            elBase.value = location.origin;   // provisional: la dirección desde la que se abrió esta página
        }
        try {
            almacenes = await getAlmacenes();
            pintar();
        } catch (e) {
            mostrarMensaje('No se pudo cargar la lista de almacenes. ' + e.message, true);
        }
    }

    elBase.addEventListener('input', pintar);
    document.getElementById('btn-imprimir').addEventListener('click', () => window.print());
    iniciar();
</script>
</body>
</html>
