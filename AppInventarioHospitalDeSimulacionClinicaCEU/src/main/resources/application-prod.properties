# =====================================================================
# Perfil "prod": el miniPC del hospital.
# Sin contrasenas: se leen de variables de entorno del servicio de Windows.
# Este fichero SI se sube a Git (no tiene nada secreto).
# =====================================================================

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Pocas conexiones: servidor compartido con SIMStation
spring.datasource.hikari.maximum-pool-size=5

# --- Servidor ---
# Solo escucha DENTRO del miniPC; desde fuera solo se entra por Tailscale Funnel.
server.address=127.0.0.1
server.port=8080

# --- Registro de errores ---
logging.file.name=logs/inventario.log
logging.logback.rollingpolicy.max-history=30

inventario.clave=${INVENTARIO_CLAVE}
